name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run generate
      - run: git diff --exit-code -- nodes/shared/catalog.json docs/API-COVERAGE.md docs/operation-contracts.json integrations/make
      - run: npm run check
      - name: Check standalone Make tooling
        run: |
          npm ci --ignore-scripts --prefix tools/make-uploader
          npx tsc --noEmit --strict --target es2022 --module nodenext --moduleResolution nodenext --skipLibCheck tools/make-uploader/upload.mts
          node tools/make-uploader/upload.mts
      - run: npm pack --dry-run
